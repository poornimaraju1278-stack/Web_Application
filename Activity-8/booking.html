
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Book IPL Tickets</title>

    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <!-- Navigation -->

    <header>
        <div class="header-container">

            <h1>IPL Ticket Booking</h1>

            <a href="index.html">Home</a>

        </div>
    </header>


    <!-- Booking Form Section -->

    <section id="booking">

        <h2>Book Your IPL Tickets</h2>

        <form action="#" method="post" id="ticketForm">

            <!-- Personal Details -->

            <label for="name">Name</label>

            <input type="text"
                   id="name"
                   name="name"
                   required
                   minlength="3"
                   maxlength="50">

            <br><br>


            <label for="email">Email</label>

            <input type="email"
                   id="email"
                   name="email"
                   required>

            <br><br>


            <label for="phone">Phone Number</label>

            <input type="tel"
                   id="phone"
                   name="phone"
                   required
                   minlength="10"
                   maxlength="10"
                   pattern="[0-9]{10}"
                   title="Enter a 10 digit phone number">

            <br><br>


            <!-- Match Selection -->

            <label for="match">Select Match</label>

            <select id="match" name="match" required>

                <option value="">-- Choose a match --</option>

                <option value="RCB vs CSK">RCB vs CSK</option>

                <option value="MI vs KKR">MI vs KKR</option>

                <option value="CSK vs SRH">CSK vs SRH</option>

            </select>

            <br><br>


            <!-- Stand Selection -->

            <label for="stand">Stand Category</label>

            <select id="stand" name="stand" required>

                <option value="">-- Choose a stand --</option>

                <option value="General">General - ₹4,000</option>

                <option value="Premium">Premium - ₹7,000</option>

                <option value="VIP">VIP - ₹10,000</option>

            </select>

            <br><br>


            <!-- Ticket Quantity -->

            <label for="quantity">Number of Tickets (1 to 10)</label>

            <input type="number"
                   id="quantity"
                   name="quantity"
                   required
                   min="1"
                   max="10"
                   value="1">

            <br><br>


            <!-- Ticket Delivery -->

            <p><strong>Ticket Delivery:</strong></p>

            <input type="radio"
                   id="email-ticket"
                   name="delivery"
                   value="Email"
                   required>

            <label for="email-ticket">E-ticket</label>


            <input type="radio"
                   id="pickup"
                   name="delivery"
                   value="Pickup">

            <label for="pickup">Collect at stadium</label>

            <br><br>


            <!-- Terms and Conditions -->

            <input type="checkbox"
                   id="terms"
                   name="terms"
                   required>

            <label for="terms">
                I agree to the terms and conditions
            </label>

            <br><br>


            <!-- Form Buttons -->

            <button type="submit">Submit Booking</button>

            <button type="reset">Reset</button>

        </form>


        <!-- Booking Summary -->

        <div class="summary-card">

            <h2>Booking Summary</h2>

            <p>
                <strong>Selected Match:</strong>
                <span id="summaryMatch">Not Selected</span>
            </p>

            <p>
                <strong>Stand Category:</strong>
                <span id="summaryStand">Not Selected</span>
            </p>

            <p>
                <strong>Number of Tickets:</strong>
                <span id="summaryQuantity">1</span>
            </p>

            <p>
                <strong>Total Amount:</strong>
                <span id="summaryTotal">₹0</span>
            </p>

        </div>

    </section>


    <!-- Footer -->

    <footer>
        <p>&copy; 2026 IPL Ticket Booking. All Rights Reserved.</p>
    </footer>


    <!-- JavaScript -->

    <script src="app.js"></script>

</body>

</html>
